name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloud-run-model-council
  cancel-in-progress: true

env:
  SERVICE: model-council
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'asia-south1' }}
  ALLOWED_ORIGINS: ${{ vars.MODEL_COUNCIL_ALLOWED_ORIGINS }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$PROJECT_ID" || { echo "Set repository variable GCP_PROJECT_ID."; exit 1; }
          test -n "$REGION" || { echo "Set repository variable CLOUD_RUN_REGION."; exit 1; }
          test -n "$ALLOWED_ORIGINS" || { echo "Set repository variable MODEL_COUNCIL_ALLOWED_ORIGINS to the exact Cloud Run or custom-domain HTTPS origin."; exit 1; }

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          source: .
          env_vars: |
            MODEL_COUNCIL_ALLOWED_ORIGINS=${{ env.ALLOWED_ORIGINS }}
          timeout: 300s
          flags: >-
            --port=8080
            --memory=256Mi
            --cpu=1
            --concurrency=8
            --min-instances=0
            --max-instances=1

      - name: Show service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
